name: Publish Quarto book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Install vector-diagram dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"
          "$HOME/.TinyTeX/bin/x86_64-linux/tlmgr" install standalone pgf braket quantikz

      - name: Render HTML and PDF books
        run: quarto render QSP_Lecture_Notes

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload rendered book
        uses: actions/upload-pages-artifact@v5
        with:
          path: QSP_Lecture_Notes/_book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
